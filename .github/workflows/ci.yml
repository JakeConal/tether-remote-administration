name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@v4

      # Both runner families ship vcpkg preinstalled at VCPKG_INSTALLATION_ROOT.
      - name: Configure (vcpkg manifest mode)
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: bash
        run: cmake --build build --config $BUILD_TYPE --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure -C $BUILD_TYPE
